<!doctype html>
<meta charset="utf-8">
<title>Annotate</title>
<style>
  :root{
    --card:#1c1c1c; --panel:#232323; --line:#303030; --line2:#3a3a3a;
    --text:#e6e6e6; --dim:#8a8a8a; --faint:#6a6a6a;
    --accent:#7aa2f7; --danger:#d08a70; --ok:#7ab88a;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--card);color:var(--text);overflow:hidden;
       font:14px/1.5 "Inter","Segoe UI",system-ui,sans-serif}
  .win{height:100%;display:flex;flex-direction:column;border:1px solid var(--line2)}
  .bar{display:flex;align-items:center;gap:8px;padding:0 4px 0 12px;height:34px;flex:none;
       background:#1a1a1a;border-bottom:1px solid var(--line);user-select:none}
  .bar .t{font-size:12px;color:var(--dim);flex:1;white-space:nowrap;overflow:hidden;
          text-overflow:ellipsis;cursor:move}
  .btn{width:30px;height:26px;display:grid;place-items:center;border:0;background:transparent;
       color:var(--dim);font-size:15px;cursor:pointer;border-radius:2px;font-family:inherit}
  .btn:hover{background:#2c2c2c;color:var(--text)}
  .btn.x:hover{background:#a33;color:#fff}
  .tabs{display:flex;border-bottom:1px solid var(--line);background:#191919;flex:none;
        user-select:none}
  .tab{padding:8px 16px;font-size:14px;color:var(--dim);cursor:pointer;font-family:inherit;
       border:0;background:transparent}
  .tab:hover{color:var(--text)}
  .tab.on{color:var(--text);background:#303030}
  .tab .k{color:var(--dim);font-size:12px;margin-left:6px}
  .pane{flex:1;min-height:0;min-width:0;width:100%;padding:14px;display:none;flex-direction:column;gap:10px}
  .pane.on{display:flex}
  .meta{display:flex;gap:10px;align-items:baseline;font-size:12px;color:var(--dim)}
  .meta .src{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta .stamp{margin-left:auto;color:var(--faint);font-size:12px;white-space:nowrap}
  .pick{display:flex;gap:6px;align-items:center;flex:none}
  #chips{min-width:0;flex-wrap:wrap}
  .chip{font-size:14px;padding:3px 10px;border:1px solid var(--line);background:transparent;
        color:var(--faint);cursor:pointer;font-family:inherit}
  .chip.on{background:#303030;border-color:#5a5a5a;color:var(--text)}
  .count{font-size:12px;color:var(--faint);white-space:nowrap}
  textarea,input{font-family:inherit;color:var(--text);background:var(--panel);
                 border:1px solid var(--line);outline:none}
  textarea{padding:10px 12px;font-size:13px;line-height:1.5;resize:none}
  textarea:focus,input:focus{border-color:var(--accent)}
  #quote{flex:1 1 auto;min-height:96px;max-height:42%;color:#cfcfcf}
  #comment{flex:1 1 auto;min-height:88px;border-color:var(--accent)}
  .foot{display:flex;align-items:center;gap:8px;flex:none;user-select:none}
  .status{font-size:12px;color:var(--danger);flex:1;min-width:0;overflow-wrap:anywhere}
  .status.ok{color:var(--ok)}
  .hint{font-size:12px;color:var(--dim);white-space:nowrap}
  .go{font-size:14px;padding:6px 14px;border:1px solid var(--line2);background:#2a2a2a;
      color:var(--text);cursor:pointer;font-family:inherit;white-space:nowrap}
  .go:hover{background:#343434}
  .go.primary{background:#2f4a7a;border-color:#3d5f96}
  .go.primary:hover{background:#37568c}
  .go:disabled{opacity:.55;cursor:not-allowed}
  .save-problem{font-size:12px;color:var(--danger);overflow-wrap:anywhere;flex:none}
  .go.ghost{background:transparent;color:var(--dim);border-color:transparent}
  .go.ghost:hover{background:#252525;color:var(--text)}
  .search{display:flex;gap:8px;align-items:center;flex:none;user-select:none}
  .search input{flex:1;min-width:0;padding:6px 10px;font-size:14px}

  /* one continuous document: drag anywhere, select across as many entries as you like */
  #doc{flex:1;min-height:80px;min-width:0;overflow:auto;border:1px solid var(--line);background:var(--panel);
       font-size:13px;outline:none;padding:0;cursor:text;white-space:normal}
  #doc:focus{border-color:var(--line2)}
  .entry{padding:10px 14px 12px}
  .entry.a{background:#202020}
  .entry.b{background:#262626}
  /* dim reference line, like a blame annotation: shown, never copied, never edited */
  .blame{font-size:12px;color:var(--faint);margin-bottom:5px;user-select:none;
         -webkit-user-select:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .q{color:#cfcfcf;white-space:pre-wrap;overflow-wrap:anywhere}
  .c{color:var(--text);white-space:pre-wrap;overflow-wrap:anywhere;margin-top:2px}
  .sep{color:var(--faint);font-size:13px;padding:0 14px;line-height:2.1;background:#1d1d1d}
  .empty{padding:22px 14px;color:var(--faint);font-size:12px;user-select:none}
  mark{background:#3a3a1a;color:#e8e0a0;padding:0 2px}
  .grip{position:fixed;right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize;z-index:5;
        background:repeating-linear-gradient(135deg,transparent,transparent 2px,#4a4a4a 2px,#4a4a4a 3px)}
</style>

<div class="win">
  <div class="bar">
    <span class="t" id="title">Annotate</span>
    <button class="btn" id="sublime" title="Open annotations.md in Sublime">&#8599;</button>
    <button class="btn" id="minimise" title="Minimise">&#8211;</button>
    <button class="btn x" id="close" title="Close (Esc)">&#10005;</button>
  </div>

  <div class="tabs">
    <button class="tab on" data-pane="add">Add<span class="k">Ctrl+1</span></button>
    <button class="tab" data-pane="list">List<span class="k">Ctrl+L</span></button>
  </div>

  <div class="pane on" id="pane-add">
    <div class="meta">
      <span class="src" id="source"></span>
      <span class="stamp" id="stamp"></span>
    </div>
    <div class="pick">
      <span id="chips" style="display:flex;gap:6px"></span>
      <span class="count" style="margin-left:auto" id="chars"></span>
    </div>
    <textarea id="quote" spellcheck="false"></textarea>
    <textarea id="comment" placeholder="comment"></textarea>
    <div class="foot">
      <span class="status" id="addstatus"></span>
      <span class="hint">Ctrl+Enter</span>
      <button class="go ghost" id="cancel">Cancel</button>
      <button class="go primary" id="add">Add annotation</button>
    </div>
  </div>

  <div class="pane" id="pane-list">
    <div class="search">
      <input id="filter" placeholder="Filter annotations&#8230;  Ctrl+F" spellcheck="false">
      <span class="count" id="shown"></span>
      <button class="go ghost" id="selectall">Select all</button>
      <button class="go ghost" id="copyall">Copy all</button>
    </div>
    <div id="doc" contenteditable spellcheck="false"></div>
    <div id="saveproblem" class="save-problem" role="alert" hidden></div>
    <div class="foot">
      <span class="status" id="liststatus"></span>
      <span class="hint">drag to select · Ctrl+C</span>
      <button class="go ghost" id="revert">Revert</button>
      <button class="go primary" id="save">Save edits</button>
    </div>
  </div>
</div>
<div class="grip" id="grip" title="Resize"></div>

<script>
const S = window.__STATE__ || {source:"", stamp:"", candidates:[], entries:[]};
const host = m => window.webkit.messageHandlers.host.postMessage(JSON.stringify(m));
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function setStatus(id, text, ok) {
  const el = $(id);
  el.textContent = text;
  el.classList.toggle("ok", !!ok);
}

/* ---------- window chrome ---------- */
$("close").onclick = () => host({action:"close"});
$("minimise").onclick = () => host({action:"minimise"});
$("sublime").onclick = () => host({action:"sublime"});
$("title").addEventListener("mousedown", e => { if (e.button === 0) host({action:"drag"}); });
$("grip").addEventListener("mousedown", e => { e.preventDefault(); host({action:"resize"}); });

/* ---------- tabs ---------- */
const showPane = name => {
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.pane === name));
  document.querySelectorAll(".pane").forEach(p => p.classList.toggle("on", p.id === "pane-" + name));
  if (name === "add") $("comment").focus(); else $("filter").focus();
};
document.querySelectorAll(".tab").forEach(t => t.onclick = () => showPane(t.dataset.pane));

/* ---------- add pane ---------- */
$("source").textContent = S.source;
$("stamp").textContent = S.stamp;
const countChars = () => $("chars").textContent = $("quote").value.length + " chars";
$("quote").addEventListener("input", countChars);

S.candidates.forEach((c, i) => {
  const b = document.createElement("button");
  b.className = "chip" + (i === 0 ? " on" : "");
  b.textContent = c.label;
  b.onclick = () => pickCandidate(i);
  $("chips").appendChild(b);
});
let candidate = 0;
function pickCandidate(i) {
  if (!S.candidates[i]) return;
  candidate = i;
  [...$("chips").children].forEach((b, n) => b.classList.toggle("on", n === i));
  $("quote").value = S.candidates[i].text;
  countChars();
}
if (S.candidates.length) pickCandidate(0);

const addAnnotation = () => {
  const quote = $("quote").value.trim(), comment = $("comment").value.trim();
  if (!quote) return setStatus("addstatus", "The quote cannot be empty.", false);
  if (!comment) { setStatus("addstatus", "Write a comment before adding this entry.", false);
                  return $("comment").focus(); }
  host({action:"add", quote, comment, label:(S.candidates[candidate]||{}).label || ""});
};
$("add").onclick = addAnnotation;
$("cancel").onclick = () => host({action:"close"});

/* ---------- the list, as one document ---------- */
let nextEntryId = 0;
let entries = S.entries.map(e => ({...e, id:nextEntryId++}));
let renderedIds = new Set();
let appliedFilter = "";
let saveProblem = S.saveProblem || "";
const doc = $("doc");

function renderDoc() {
  const q = $("filter").value.trim().toLowerCase();
  appliedFilter = $("filter").value;
  const visible = entries.filter(e =>
    !q || e.quote.toLowerCase().includes(q) || e.comment.toLowerCase().includes(q)
         || e.source.toLowerCase().includes(q));
  renderedIds = new Set(visible.map(e => e.id));
  $("shown").textContent = q ? visible.length + " of " + entries.length
                             : entries.length + (entries.length === 1 ? " entry" : " entries");
  $("title").textContent = "Annotate — " + entries.length +
                           (entries.length === 1 ? " annotation" : " annotations");
  if (!visible.length) {
    doc.innerHTML = '<div class="empty" contenteditable="false">' +
      (entries.length ? "Nothing matches that filter." : "No annotations yet. Add one from the Add tab.") +
      "</div>";
    return;
  }
  const hi = s => q ? esc(s).replace(new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + ")","gi"),
                                     "<mark>$1</mark>") : esc(s);
  doc.innerHTML = visible.map((e, i) => `
    <div class="entry ${i % 2 ? "b" : "a"}" data-id="${e.id}">
      <div class="blame" contenteditable="false">${esc(e.stamp)} · ${esc(e.source)}</div>
      <div class="q">${hi(e.quote)}</div>
      <div class="c">→ ${hi(e.comment)}</div>
    </div>`).join('<div class="sep" contenteditable="false">---</div>');
}

/* The last rendered ids belong to this DOM, regardless of the new filter text.
   Only their missing blocks are deletions; hidden drafts always pass through. */
function collectEdits() {
  const edits = new Map();
  const malformed = () => {
    setStatus("liststatus", "An entry lost its quote or comment structure. Undo the edit (Ctrl+Z), or copy your text before Revert. Filtering and saving are paused.", false);
    return false;
  };
  for (const node of doc.childNodes) {
    if (node.nodeType === Node.ELEMENT_NODE &&
        (node.classList.contains("entry") ||
         (node.matches(".sep, .empty") && node.contentEditable === "false"))) continue;
    if (node.textContent.trim()) return malformed();
  }
  for (const block of doc.querySelectorAll(".entry")) {
    const id = Number(block.dataset.id);
    const quotes = block.querySelectorAll(".q"), comments = block.querySelectorAll(".c");
    if (!block.hasAttribute("data-id") || !renderedIds.has(id) || edits.has(id) ||
        quotes.length !== 1 || comments.length !== 1 ||
        quotes[0].parentElement !== block || comments[0].parentElement !== block) {
      return malformed();
    }
    for (const node of block.childNodes) {
      if (node === quotes[0] || node === comments[0] ||
          (node.nodeType === Node.ELEMENT_NODE && node.classList.contains("blame") &&
           node.contentEditable === "false")) continue;
      if (node.textContent.trim()) return malformed();
    }
    edits.set(id, {
      quote: quotes[0].innerText.replace(/\n$/, ""),
      comment: comments[0].innerText.replace(/\n$/, "").replace(/^→\s*/, ""),
    });
  }
  if ([...doc.querySelectorAll(".q, .c")].some(part =>
      !part.parentElement.classList.contains("entry"))) {
    return malformed();
  }
  entries = entries
    .filter(e => edits.has(e.id) || !renderedIds.has(e.id))
    .map(e => edits.has(e.id) ? {...e, ...edits.get(e.id)} : e);
  return true;
}

function updateSaveProblem(problem) {
  saveProblem = problem || "";
  $("save").disabled = !!saveProblem;
  $("save").title = saveProblem;
  $("saveproblem").hidden = !saveProblem;
  $("saveproblem").textContent = saveProblem ? "Saving is blocked: " + saveProblem + " Copy your drafts before Revert or reopening the file." : "";
}

// Copy all includes hidden drafts; selection copy still follows the visible DOM.
const plainText = list => list.map(e => e.quote + "\n→ " + e.comment).join("\n---\n");

doc.addEventListener("input", () => setStatus("liststatus", "Unsaved edits.", false));
$("filter").addEventListener("input", () => {
  if (!collectEdits()) { $("filter").value = appliedFilter; return; }
  renderDoc();
});

$("selectall").onclick = () => {
  const range = document.createRange();
  range.selectNodeContents(doc);
  const selection = getSelection();
  selection.removeAllRanges();
  selection.addRange(range);
  doc.focus();
  setStatus("liststatus", "Everything selected. Ctrl+C to copy.", true);
};
$("copyall").onclick = () => {
  if (!collectEdits() || !entries.length) return;
  host({action:"copy", text:plainText(entries)});
  setStatus("liststatus", "All " + entries.length + " entries copied.", true);
};
$("save").onclick = () => {
  if (saveProblem || !collectEdits()) return;
  host({action:"save", entries:entries.map(e =>
    ({stamp:e.stamp, source:e.source, quote:e.quote, comment:e.comment}))});
};
$("revert").onclick = () => host({action:"revert"});

/* ---------- messages from the host ---------- */
window.fromHost = msg => {
  if (msg.kind === "entries") {
    entries = msg.entries.map(e => ({...e, id:nextEntryId++}));
    updateSaveProblem(msg.saveProblem);
    renderDoc();
    if (msg.status) setStatus("liststatus", msg.status, true);
  } else if (msg.kind === "error") {
    setStatus(msg.pane === "add" ? "addstatus" : "liststatus", msg.status, false);
  } else if (msg.kind === "status") {
    setStatus(msg.pane === "add" ? "addstatus" : "liststatus", msg.status, !!msg.ok);
  }
};

/* ---------- keys ---------- */
const listOpen = () => $("pane-list").classList.contains("on");
addEventListener("keydown", e => {
  if (e.key === "Escape") { host({action:"close"}); return; }
  if (!e.ctrlKey) return;
  const k = e.key.toLowerCase();
  if (k === "enter") { e.preventDefault(); listOpen() ? $("save").click() : addAnnotation(); }
  else if (k === "1") { e.preventDefault(); showPane("add"); }
  else if (k === "2" || k === "l") { e.preventDefault(); showPane("list"); }
  else if (k === "f") { e.preventDefault(); showPane("list"); $("filter").select(); }
  else if (k === "a" && listOpen() && doc.contains(document.activeElement)) {
    e.preventDefault(); $("selectall").click();
  }
});

updateSaveProblem(saveProblem);
renderDoc();
showPane(S.entries.length && !S.candidates.length ? "list" : "add");
</script>
